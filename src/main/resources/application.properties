spring.application.name=leja
# cannot use localhost if the app is running in a docker container,
# so we use host.docker.internal to access the host machine
# if running from localhost, you can use localhost instead of host.docker.internal
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leja}

# add your database username and password in the environment variables
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true